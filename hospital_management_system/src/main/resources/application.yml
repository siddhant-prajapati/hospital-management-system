# ============================================================
#  Hospital Management System — Application Configuration
# ============================================================

server:
  port: 8080
  servlet:
    context-path: /api/v1

# ── Spring ──────────────────────────────────────────────────
spring:
  application:
    name: hospital-management-system

  # ── DataSource (PostgreSQL) ─────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/hms_db}}
    username: ${DB_USERNAME:hms_user}
    password: ${DB_PASSWORD:hms_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      pool-name: HMSHikariPool

  # ── JPA / Hibernate ─────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update          # auto-creates/updates tables; switch to validate for production
    show-sql: false               # Set true for local debugging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 30
          order_inserts: true
          order_updates: true

  # ── Flyway (DB migrations) ───────────────────────────────
  flyway:
    enabled: false               # Disabled for development; enable and add migration scripts for production

# ── Security / JWT ──────────────────────────────────────────
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000          # 24 hours in ms
      refresh-token:
        expiration: 604800000       # 7 days in ms

# ── Spring Boot Actuator (Monitoring) ───────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env, loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    build:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ── Info endpoint metadata ───────────────────────────────────
info:
  app:
    name: Hospital Management System
    version: 1.0.0
    description: Scalable HMS REST API
  contact:
    team: Backend Engineering

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.hospital.hms: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/hms-application.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB

