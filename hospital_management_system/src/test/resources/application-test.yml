# ============================================================
#  Test Profile — uses H2 in-memory database
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:hms_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

logging:
  level:
    com.hospital.hms: DEBUG

